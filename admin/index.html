<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم — الضبيبي</title>
  <link rel="icon" href="../assets/logo-mark.png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <link rel="stylesheet" href="admin.css?v=mw9k22vf">
</head>
<body>
  <!-- تسجيل الدخول -->
  <div class="login" id="login" hidden>
    <form class="login-box" id="loginForm">
      <img src="../assets/logo-mark.png" alt="">
      <h1>لوحة التحكم</h1>
      <p>شركة الضبيبي التجارية</p>
      <input type="text" id="un" placeholder="اسم المستخدم" autocomplete="username" dir="auto" required>
      <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password" required>
      <button class="btn gold" type="submit">دخول</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>

  <!-- اللوحة -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <div class="side-brand"><img src="../assets/logo-mark.png" alt=""><div><b>لوحة التحكم</b><small>الضبيبي التجارية</small></div></div>
      <nav id="tabs"></nav>
      <div class="side-foot">
        <div class="me" id="meBox"></div>
        <a href="../" target="_blank" class="side-link">↗ عرض الموقع</a>
        <button class="side-link" id="logout">تسجيل الخروج</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="top-title"><h2 id="tabTitle"></h2><p id="tabHint"></p></div>
        <span class="dirty" id="dirty" hidden>● تغييرات غير محفوظة</span>
        <button class="btn gold" id="saveBtn">حفظ التغييرات</button>
        <button class="btn pub" id="pubBtn" title="رفع آخر التعديلات المحفوظة إلى الموقع اللي يشوفه العملاء">🌐 نشر على الموقع</button>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="filePick" accept="image/*" hidden>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script>window.GH_CONFIG = { owner: "dhtrd", repo: "storedh", branch: 'main' };</script>
  <script src="gh-admin.js?v=mw9k22vf"></script>
  <script src="admin.js?v=mw9k22vf"></script>
</body>
</html>
